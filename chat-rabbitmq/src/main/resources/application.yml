server:
  port: 8080

spring:

  # mariadb
  datasource:
    url: ${MARIADB_URI} # jdbc:mariadb://localhost:3306/chatdb
    username: ${MARIADB_USERNAME} # challengers
    password: ${MARIADB_PASSWORD} # challengers
    driver-class-name: org.mariadb.jdbc.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  # mongodb
  data:
    mongodb:
      uri: ${MONGODB_URI} # mongodb://localhost:27017/challengers

  # rabbitMQ
  rabbitmq:
    host: ${RMQ_HOST}
    port: ${RMQ_PORT}
    username: ${RMQ_USERNAME}
    password: ${RMQ_PASSWORD}
#    virtual-host: ${RAB_VHOST} # 기본값 '/'

logging:
  level:
    org.springframework.messaging: DEBUG
    org.springframework.web.socket: DEBUG
    org.springframework.web.socket.messaging: DEBUG
    org.springframework.web.socket.sockjs: DEBUG
    org.springframework.messaging.simp: DEBUG
